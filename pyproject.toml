[project]
name = "deriva-load-testing"
version = "0.1.0"
description = "Generic load testing tool for chaise page performance."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
]

[project.scripts]
deriva-load-test = "deriva_load_testing.cli:main_runner"

[dependency-groups]
dev = ["ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deriva_load_testing"]

[tool.ruff]
line-length = 88
target-version = "py311"
